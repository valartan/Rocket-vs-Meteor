<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Scratch by Number – 200x200 (Natural Drag)</title>
<style>
  body {
    font-family: Arial, sans-serif;
    margin: 16px;
    background: #111;
    color: #f5f5f5;
  }

  h1 {
    margin-bottom: 4px;
  }

  .section {
    margin-top: 14px;
    margin-bottom: 10px;
  }

  #pixelCanvas {
    image-rendering: pixelated;
    width: 320px;
    height: 320px;
    border: 2px solid #333;
    background: #222;
    margin-top: 6px;
    display: block;
  }

  #grid {
    display: grid;
    grid-template-columns: repeat(200, 3px);
    grid-auto-rows: 3px;
    gap: 1px;
    margin-top: 10px;
    touch-action: none;
    background: #000;
    padding: 4px;
    border-radius: 8px;
    max-width: calc(200 * 4px + 10px);
  }

  .cell {
    width: 3px;
    height: 3px;
    background: #000;
  }

  .palette-swatch {
    display: inline-block;
    width: 20px;
    height: 20px;
    border-radius: 4px;
    border: 1px solid #000;
    margin-right: 4px;
    margin-bottom: 4px;
  }

  .palette-buttons {
    margin-top: 6px;
    display: flex;
    flex-wrap: wrap;
    gap: 4px;
  }

  .palette-buttons button {
    padding: 4px 8px;
    border-radius: 4px;
    border: 1px solid #444;
    cursor: pointer;
    font-size: 11px;
    display: flex;
    align-items: center;
    gap: 4px;
    background: #222;
    color: #f5f5f5;
  }

  .palette-buttons button.selected {
    outline: 2px solid #fff;
    outline-offset: 1px;
    box-shadow: 0 0 8px rgba(255,255,255,0.5);
  }

  .dot {
    width: 12px;
    height: 12px;
    border-radius: 999px;
    border: 1px solid rgba(0,0,0,0.6);
  }

  .color-counts-row {
    display: flex;
    align-items: center;
    gap: 6px;
    margin-bottom: 2px;
    font-size: 12px;
  }

  .progress-bar-outer {
    width: 280px;
    height: 10px;
    border-radius: 999px;
    background: #333;
    margin-top: 6px;
    border: 1px solid #555;
    overflow: hidden;
  }

  .progress-bar-inner {
    height: 100%;
    width: 0%;
    background: linear-gradient(90deg, #52ff9f, #28aadc);
    transition: width 0.15s ease-out;
  }

  .progress-text {
    font-size: 12px;
    margin-top: 4px;
  }
</style>
</head>
<body>

<h1>Scratch by Number – 200×200 (Natural Drag)</h1>

<div class="section">
  <div>Choisir une image :</div>
  <input type="file" id="fileInput" accept="image/png,image/jpeg">
</div>

<div class="section">
  <h3>Aperçu pixelisé</h3>
  <canvas id="pixelCanvas" width="200" height="200"></canvas>
</div>

<div class="section">
  <h3>Palette réduite</h3>
  <div id="paletteDisplay"></div>
</div>

<h3>Grattage</h3>
Couleur active : <span id="activeColorLabel">aucune</span>

<div class="palette-buttons" id="paletteButtons"></div>

<div id="colorCounts"></div>

<div class="progress-bar-outer">
  <div class="progress-bar-inner" id="progressInner"></div>
</div>
<div class="progress-text" id="progressText">Progression : 0%</div>

<div id="grid"></div>

<script>
// =======================================================================
// CONFIGURATION
// =======================================================================
const SIZE = 200;
const MAX_COLORS = 15;
const BRUSH_RAD = 4; // 9x9 → très fluide

let CURRENT_PALETTE = [];
let CURRENT_LEVEL = [];
let CELLS = [];
let REVEALED = [];
let ACTIVE_INDEX = null;
let dragging = false;
let totalRevealed = 0;

let countsByColor = {};
let revealedByColor = {};

const totalCells = SIZE * SIZE;

const fileInput = document.getElementById("fileInput");
const canvas = document.getElementById("pixelCanvas");
const ctx = canvas.getContext("2d");
const paletteDisplay = document.getElementById("paletteDisplay");
const paletteBtns = document.getElementById("paletteButtons");
const activeLabel = document.getElementById("activeColorLabel");
const colorCountsDiv = document.getElementById("colorCounts");
const progressInner = document.getElementById("progressInner");
const progressText = document.getElementById("progressText");
const gridDiv = document.getElementById("grid");


// =======================================================================
// IMPORT IMAGE
// =======================================================================
fileInput.addEventListener("change", () => {
  const file = fileInput.files[0];
  if (!file) return;

  const img = new Image();
  img.onload = () => {
    ctx.drawImage(img, 0, 0, SIZE, SIZE);
    processImage();
  };
  img.src = URL.createObjectURL(file);
});


// =======================================================================
// UTILITAIRES
// =======================================================================
function dist(a,b) {
  return Math.sqrt(
    (a[0]-b[0])**2 +
    (a[1]-b[1])**2 +
    (a[2]-b[2])**2
  );
}

function getPixels() {
  const d = ctx.getImageData(0,0,SIZE,SIZE).data;
  const out = [];
  for (let i=0;i<d.length;i+=4)
    out.push([d[i], d[i+1], d[i+2]]);
  return out;
}

function reduceColors(pixels, max) {
  const centers = [];
  for (let i=0;i<max;i++)
    centers.push([...pixels[Math.floor(Math.random()*pixels.length)]]);

  for (let iter=0; iter<5; iter++) {
    const groups = Array.from({length:max},()=>[]);
    for (let p of pixels) {
      let best=0, bestD=Infinity;
      for (let c=0;c<max;c++) {
        const d=dist(p,centers[c]);
        if(d<bestD){bestD=d;best=c;}
      }
      groups[best].push(p);
    }
    for (let c=0;c<max;c++) {
      if(groups[c].length===0) continue;
      let r=0,g=0,b=0;
      for(let p of groups[c]){r+=p[0];g+=p[1];b+=p[2];}
      centers[c]=[
        Math.round(r/groups[c].length),
        Math.round(g/groups[c].length),
        Math.round(b/groups[c].length)
      ];
    }
  }
  return centers;
}

function generateLevel(palette) {
  const d = ctx.getImageData(0,0,SIZE,SIZE).data;
  let idx=0;
  const grid=[];
  for(let y=0;y<SIZE;y++){
    const row=[];
    for(let x=0;x<SIZE;x++){
      const r=d[idx], g=d[idx+1], b=d[idx+2];
      idx+=4;
      let best=0, bestD=Infinity;
      for(let i=0;i<palette.length;i++){
        const dd=dist([r,g,b],palette[i]);
        if(dd<bestD){bestD=dd;best=i;}
      }
      row.push(best+1);
    }
    grid.push(row);
  }
  return grid;
}

function rgb(a){ return `rgb(${a[0]},${a[1]},${a[2]})`; }


// =======================================================================
// PIPELINE IMAGE
// =======================================================================
function processImage() {
  const pixels = getPixels();
  const palette = reduceColors(pixels, MAX_COLORS);
  const level = generateLevel(palette);

  CURRENT_PALETTE = palette;
  CURRENT_LEVEL = level;

  initCounters();
  buildPaletteUI();
  buildGrid();

  updateProgress();
  updateColorCounts();
}


// =======================================================================
// COUNTERS
// =======================================================================
function initCounters() {
  countsByColor = {};
  revealedByColor = {};

  for(let i=1;i<=CURRENT_PALETTE.length;i++){
    countsByColor[i]=0;
    revealedByColor[i]=0;
  }

  for(let r=0;r<SIZE;r++){
    for(let c=0;c<SIZE;c++){
      countsByColor[ CURRENT_LEVEL[r][c] ]++;
    }
  }

  totalRevealed = 0;
}

function updateProgress() {
  const pct = (totalRevealed / totalCells * 100).toFixed(1);
  progressInner.style.width = pct + "%";
  progressText.textContent = "Progression : " + pct + "%";
}

function updateColorCounts() {
  colorCountsDiv.innerHTML = "";
  for(let i=1;i<=CURRENT_PALETTE.length;i++){
    const remain = countsByColor[i] - revealedByColor[i];
    const row = document.createElement("div");
    row.className = "color-counts-row";
    row.innerHTML =
      `<div class="color-count-swatch" style="width:14px;height:14px;
        background:${rgb(CURRENT_PALETTE[i-1])}"></div>
       #${i} : reste ${remain}`;
    colorCountsDiv.appendChild(row);
  }
}


// =======================================================================
// PALETTE UI
// =======================================================================
function buildPaletteUI() {
  paletteDisplay.innerHTML = "";
  paletteBtns.innerHTML = "";
  ACTIVE_INDEX = null;
  activeLabel.textContent = "aucune";

  CURRENT_PALETTE.forEach(col=>{
    const sw = document.createElement("div");
    sw.className="palette-swatch";
    sw.style.background = rgb(col);
    paletteDisplay.appendChild(sw);
  });

  CURRENT_PALETTE.forEach((col, idx)=>{
    const i=idx+1;
    const btn=document.createElement("button");
    btn.dataset.index=i;
    btn.innerHTML =
      `<span class="dot" style="background:${rgb(col)}"></span>#${i}`;
    btn.onclick=()=>selectColor(i);
    paletteBtns.appendChild(btn);
  });
}

function selectColor(i){
  ACTIVE_INDEX = i;
  activeLabel.textContent = i;

  document.querySelectorAll(".palette-buttons button")
    .forEach(btn=>{
      btn.classList.toggle("selected",
        parseInt(btn.dataset.index)===i);
    });
}


// =======================================================================
// GRILLE & GRATTAGE
// =======================================================================
function buildGrid() {
  gridDiv.innerHTML = "";
  CELLS=[];
  REVEALED=[];

  for(let r=0;r<SIZE;r++){
    const rowCells=[];
    const rowRev=[];
    for(let c=0;c<SIZE;c++){
      const d=document.createElement("div");
      d.className="cell";
      d.dataset.r=r;
      d.dataset.c=c;
      gridDiv.appendChild(d);
      rowCells.push(d);
      rowRev.push(false);
    }
    CELLS.push(rowCells);
    REVEALED.push(rowRev);
  }
}

function revealOne(r,c){
  if(r<0||c<0||r>=SIZE||c>=SIZE) return;
  if(REVEALED[r][c]) return;
  if(ACTIVE_INDEX==null) return;
  if(CURRENT_LEVEL[r][c]!==ACTIVE_INDEX) return;

  REVEALED[r][c]=true;
  CELLS[r][c].style.background = rgb(CURRENT_PALETTE[ACTIVE_INDEX-1]);
  revealedByColor[ACTIVE_INDEX]++;
  totalRevealed++;
}

function revealBrush(r,c){
  for(let dy=-BRUSH_RAD;dy<=BRUSH_RAD;dy++){
    for(let dx=-BRUSH_RAD;dx<=BRUSH_RAD;dx++){
      revealOne(r+dy, c+dx);
    }
  }
  updateProgress();
  updateColorCounts();
}


// =======================================================================
// GRATTAGE NATUREL (mousedown + move + mouseup)
// =======================================================================
gridDiv.style.userSelect="none";

// Souris
gridDiv.addEventListener("mousedown", e=>{
  dragging=true;
  handlePointer(e.clientX,e.clientY);
});
document.addEventListener("mouseup", ()=> dragging=false);
gridDiv.addEventListener("mousemove", e=>{
  if(dragging) handlePointer(e.clientX,e.clientY);
});

// Mobile
gridDiv.addEventListener("touchstart", e=>{
  dragging=true;
  const t=e.touches[0];
  handlePointer(t.clientX,t.clientY);
  e.preventDefault();
},{passive:false});
gridDiv.addEventListener("touchmove", e=>{
  if(!dragging) return;
  const t=e.touches[0];
  handlePointer(t.clientX,t.clientY);
  e.preventDefault();
},{passive:false});
document.addEventListener("touchend", ()=> dragging=false);


// =======================================================================
// POSITION → CELL
// =======================================================================
function handlePointer(x,y){
  const elem=document.elementFromPoint(x,y);
  if(!elem || !elem.classList.contains("cell")) return;
  const r=parseInt(elem.dataset.r);
  const c=parseInt(elem.dataset.c);
  revealBrush(r,c);
}

</script>
</body>
</html>
