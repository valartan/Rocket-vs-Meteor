}

function drawMask() {
    ctx.fillStyle = "black";
    ctx.fillRect(0, 0, 400, 400);
}

canvas.addEventListener("mousemove", e => {
    scratch(e.clientX, e.clientY);
});

canvas.addEventListener("touchstart", e => {
    e.preventDefault();
    if (!e.touches[0]) return;
    scratch(e.touches[0].clientX, e.touches[0].clientY);
}, {passive:false});

canvas.addEventListener("touchmove", e => {
    e.preventDefault();
    if (!e.touches[0]) return;
    scratch(e.touches[0].clientX, e.touches[0].clientY);
}, {passive:false});

function scratch(cx, cy) {
    if (active === null) return;
    const rect = canvas.getBoundingClientRect();
    const x = cx - rect.left;
    const y = cy - rect.top;
    const s = LEVEL.length;
    if (!s) return;

    const gx = Math.floor(x / (400 / s));
    const gy = Math.floor(y / (400 / s));
    if (gx < 0 || gy < 0 || gx >= s || gy >= s) return;

    // pinceau carré comme dans l'éditeur
    for (let dy = -brushSize; dy <= brushSize; dy++) {
        for (let dx = -brushSize; dx <= brushSize; dx++) {
            const X = gx + dx;
            const Y = gy + dy;
            if (X < 0 || Y < 0 || X >= s || Y >= s) continue;
            if (LEVEL[Y][X] === -1) continue;
            if (LEVEL[Y][X] !== active) continue;

            LEVEL[Y][X] = -1;
            remaining[active]--;
            revealed++;

            const w = 400 / s;
            const c = COLOR_PALETTE[active];
            ctx.fillStyle = "rgb(" + c.r + "," + c.g + "," + c.b + ")";
            ctx.fillRect(X * w, Y * w, w, w);
        }
    }
    document.getElementById("remainingColor").textContent = remaining[active];
    updateProgress();
}

function updateProgress() {
    const p = Math.floor((revealed / total) * 100);
    document.getElementById("progressPercent").textContent = p + "%";
    document.getElementById("progressBar").style.width = p + "%";
}

buildPalette();
drawMask();
updateProgress();
</script>

</body>
