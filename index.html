<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Scratch by Number – Level Builder</title>

<style>
html, body {
    overscroll-behavior: none;
    margin: 0;
    padding: 0;
    font-family: Arial, sans-serif;
    background: #f2f2f2;
}

h2 {
    margin: 0;
    padding: 20px;
}

#container {
    display: flex;
    gap: 20px;
    padding: 0 20px 20px;
}

.panel {
    background: white;
    padding: 20px;
    border-radius: 10px;
    width: 300px;
    box-shadow: 0 2px 5px rgba(0,0,0,0.15);
}

.bigpanel {
    flex: 1;
    background: white;
    padding: 20px;
    border-radius: 10px;
    box-shadow: 0 2px 5px rgba(0,0,0,0.15);
}

.sectionTitle {
    font-weight: bold;
    margin-bottom: 10px;
    font-size: 18px;
}

.previewBox {
    width: 260px;
    height: 260px;
    border: 2px solid #aaa;
    display: flex;
    justify-content: center;
    align-items: center;
    overflow: hidden;
    background: #ddd;
    margin-bottom: 10px;
}

.previewBox img {
    max-width: 100%;
    max-height: 100%;
    object-fit: contain;
}

#pixelCanvas {
    border: 2px solid #333;
    background: black;
    touch-action: none; /* empêche le scroll mobile */
}

.paletteColor {
    display: inline-block;
    width: 22px;
    height: 22px;
    margin-right: 5px;
    border-radius: 4px;
    border: 1px solid #888;
}

button {
    padding: 8px 12px;
    margin-top: 4px;
    cursor: pointer;
}

input[type="text"],
input[type="number"],
select {
    width: 100%;
    box-sizing: border-box;
    margin-bottom: 10px;
    padding: 6px 8px;
}

#paletteButtons button {
    margin: 4px 4px 0 0;
}
</style>
</head>

<body>

<h2>Scratch by Number – Level Builder</h2>

<div id="container">

    <!-- LEFT PANEL -->
    <div class="panel">

        <div class="sectionTitle">1. Paramètres & génération</div>

        Nom du niveau (id) :
        <input id="levelName" type="text" placeholder="ex : cat_01">

        Image source :
        <input id="imgInput" type="file" accept="image/png,image/jpeg">

        Taille grille :
        <select id="gridSize">
            <option>50 x 50</option>
            <option>100 x 100</option>
            <option selected>200 x 200</option>
        </select>

        Couleurs max (5-32) :
        <input id="maxColors" type="number" min="5" max="32" value="20">

        <button onclick="generateGrid()">Générer la grille & la palette</button>

        <br><br>
        Grille générée : <span id="gridInfo">-</span>

        <!-- PREVIEW -->
        <div class="sectionTitle" style="margin-top:20px;">2. Aperçu image</div>

        Original :
        <div class="previewBox"><img id="previewOriginal"></div>

        Pixelisé :
        <div class="previewBox"><img id="previewPixel"></div>

        Palette générée :
        <div id="palettePreview"></div>

        <br>
        <button onclick="exportHidden()">hidden.png</button>
        <button onclick="exportMask()">mask.png</button>
        <button onclick="exportIndex()">indexMap.png</button>
        <button onclick="exportPalette()">palette.json</button>
        <button onclick="exportMeta()">meta.json</button>

    </div>

    <!-- RIGHT PANEL -->
    <div class="bigpanel">

        <div class="sectionTitle">3. Test de grattage (mobile OK)</div>

        Couleur active :
        <span id="activeColor">aucune</span>

        <br>
        Révélé :
        <span id="revealedCount">0</span> /
        <span id="totalCount">0</span>

        <div style="height:10px; width:300px; background:#ddd; border-radius:5px; margin:10px 0;">
            <div id="progressBar" style="height:100%; width:0%; background:#6cc;"></div>
        </div>

        <div id="paletteButtons"></div>

        <br><br>
        <canvas id="pixelCanvas" width="400" height="400"></canvas>

    </div>

</div>

<script>
let originalImg = null;
let resizedCanvas = document.createElement("canvas");
let resizedCtx = resizedCanvas.getContext("2d");

let pixelCanvas = document.getElementById("pixelCanvas");
let px = pixelCanvas.getContext("2d");

let LEVEL = [];
let COLOR_PALETTE = [];
let active = null;

let revealed = 0;
let totalCells = 0;

const cellPx = 400;
let touchingCanvas = false;

/*---------------------------------------------------
    LOAD IMAGE
----------------------------------------------------*/
document.getElementById("imgInput").addEventListener("change", (e)=>{
    let file = e.target.files[0];
    if (!file) return;
    let img = new Image();
    img.onload = ()=>{
        originalImg = img;
        document.getElementById("previewOriginal").src = img.src;
    };
    img.src = URL.createObjectURL(file);
});

/*---------------------------------------------------
    GENERATE GRID
----------------------------------------------------*/
function generateGrid() {
    if (!originalImg) {
        alert("Choisis une image !");
        return;
    }

    let size = parseInt(document.getElementById("gridSize").value);
    let maxC = parseInt(document.getElementById("maxColors").value);
    maxC = Math.max(5, Math.min(32, maxC || 20));

    resizedCanvas.width = size;
    resizedCanvas.height = size;
    resizedCtx.clearRect(0,0,size,size);

    let ratio = Math.min(size/originalImg.width, size/originalImg.height);
    let w = originalImg.width * ratio;
    let h = originalImg.height * ratio;
    let x = (size - w)/2;
    let y = (size - h)/2;

    resizedCtx.imageSmoothingEnabled = false;
    resizedCtx.drawImage(originalImg, x, y, w, h);

    document.getElementById("previewPixel").src = resizedCanvas.toDataURL();

    let imgData = resizedCtx.getImageData(0,0,size,size);
    let data = imgData.data;

    COLOR_PALETTE = quantizeColors(data, maxC);

    LEVEL = [];
    revealed = 0;
    totalCells = size * size;
    document.getElementById("totalCount").textContent = totalCells;
    document.getElementById("revealedCount").textContent = 0;
    document.getElementById("progressBar").style.width = "0%";

    for (let y = 0; y < size; y++) {
        let row = [];
        for (let x = 0; x < size; x++) {
            let idx = (y*size + x)*4;
            let r=data[idx], g=data[idx+1], b=data[idx+2];
            let best = nearestColor(r,g,b);
            row.push(best);
        }
        LEVEL.push(row);
    }

    document.getElementById("gridInfo").textContent =
        size+"×"+size+", "+COLOR_PALETTE.length+" couleurs";

    buildPaletteUI();
    drawMask();
}

/*---------------------------------------------------
    COLOR QUANTIZATION
----------------------------------------------------*/
function quantizeColors(data, count){
    let colors = [];
    for(let i=0;i<data.length;i+=4){
        colors.push([data[i],data[i+1],data[i+2]]);
    }

    let centroids = [];
    for(let i=0;i<count;i++){
        centroids.push(colors[Math.floor(Math.random()*colors.length)]);
    }

    for(let it=0;it<3;it++){
        let groups = Array.from({length:count}, ()=>[]);

        for(let c of colors){
            let best=0, bestD=Infinity;
            for(let i=0;i<count;i++){
                let d = dist(c,centroids[i]);
                if(d<bestD){bestD=d; best=i;}
            }
            groups[best].push(c);
        }

        for(let i=0;i<count;i++){
            if(groups[i].length>0){
                let r=0,g=0,b=0;
                for(let c of groups[i]){
                    r+=c[0]; g+=c[1]; b+=c[2];
                }
                r/=groups[i].length;
                g/=groups[i].length;
                b/=groups[i].length;
                centroids[i]=[r,g,b];
            }
        }
    }

    return centroids.map(c=>({
        r:Math.round(c[0]),
        g:Math.round(c[1]),
        b:Math.round(c[2])
    }));
}

function dist(a,b){
    return (a[0]-b[0])**2 + (a[1]-b[1])**2 + (a[2]-b[2])**2;
}

function nearestColor(r,g,b){
    let best=0, bestD=Infinity;
    for(let i=0;i<COLOR_PALETTE.length;i++){
        let c = COLOR_PALETTE[i];
        let d = dist([r,g,b], [c.r,c.g,c.b]);
        if(d<bestD){bestD=d; best=i;}
    }
    return best;
}

/*---------------------------------------------------
    PALETTE UI
----------------------------------------------------*/
function buildPaletteUI(){
    let box = document.getElementById("paletteButtons");
    let prev = document.getElementById("palettePreview");
    box.innerHTML="";
    prev.innerHTML="";

    COLOR_PALETTE.forEach((c,i)=>{
        let div=document.createElement("div");
        div.className="paletteColor";
        div.style.background=`rgb(${c.r},${c.g},${c.b})`;
        prev.appendChild(div);

        let btn=document.createElement("button");
        btn.textContent="#"+(i+1);
        btn.onclick=()=>{
            active=i;
            document.getElementById("activeColor").textContent = (i+1);
        };
        box.appendChild(btn);
    });
}

/*---------------------------------------------------
    MASK
----------------------------------------------------*/
function drawMask(){
    px.fillStyle="black";
    px.fillRect(0,0,cellPx,cellPx);
}

/*---------------------------------------------------
    SCRATCH — SOURIS
----------------------------------------------------*/
let scratchSize = 3;

pixelCanvas.addEventListener("mousemove", function(e){
    if(active===null) return;
    if(!LEVEL.length) return;

    let rect = pixelCanvas.getBoundingClientRect();
    let x = e.clientX - rect.left;
    let y = e.clientY - rect.top;

    scratchAt(x,y);
});


/*---------------------------------------------------
    SCRATCH — MOBILE (CORRIGÉ)
----------------------------------------------------*/
pixelCanvas.addEventListener("touchstart", function(e){
    touchingCanvas = true;
    e.preventDefault();
    handleTouch(e);
}, {passive:false});

pixelCanvas.addEventListener("touchmove", function(e){
    if (!touchingCanvas) return;
    e.preventDefault();
    handleTouch(e);
}, {passive:false});

pixelCanvas.addEventListener("touchend", function(e){
    touchingCanvas = false;
});

pixelCanvas.addEventListener("touchcancel", function(e){
    touchingCanvas = false;
});

document.addEventListener("touchmove", function(e){
    if (touchingCanvas) {
        e.preventDefault();
    }
}, {passive:false});

function handleTouch(e){
    if(active===null) return;
    if(!LEVEL.length) return;

    const rect = pixelCanvas.getBoundingClientRect();
    const t = e.touches[0];
    const x = t.clientX - rect.left;
    const y = t.clientY - rect.top;

    scratchAt(x,y);
}


/*---------------------------------------------------
    SCRATCH LOGIC
----------------------------------------------------*/
function scratchAt(x,y){
    let s = LEVEL.length;
    let gx = Math.floor(x / (cellPx/s));
    let gy = Math.floor(y / (cellPx/s));

    for(let dy=-scratchSize; dy<=scratchSize; dy++){
        for(let dx=-scratchSize; dx<=scratchSize; dx++){
            let X=gx+dx, Y=gy+dy;
            if(X<0||Y<0||X>=s||Y>=s) continue;
            if(LEVEL[Y][X]===-1) continue;

            if(LEVEL[Y][X]===active){
                LEVEL[Y][X]=-1;
                revealed++;

                px.fillStyle = `rgb(${COLOR_PALETTE[active].r},${COLOR_PALETTE[active].g},${COLOR_PALETTE[active].b})`;
                let w = cellPx / s;
                px.fillRect(X*w, Y*w, w, w);

                updateProgress();
            }
        }
    }
}

function updateProgress(){
    document.getElementById("revealedCount").textContent = revealed;
    let p = (revealed / totalCells)*100;
    document.getElementById("progressBar").style.width = p+"%";
}

/*---------------------------------------------------
    EXPORTS
----------------------------------------------------*/
function exportHidden(){
    download(resizedCanvas.toDataURL(),"hidden.png");
}

function exportMask(){
    let c=document.createElement("canvas");
    c.width=LEVEL.length;
    c.height=LEVEL.length;
    let x=c.getContext("2d");
    x.fillStyle="black";
    x.fillRect(0,0,c.width,c.height);
    download(c.toDataURL(),"mask.png");
}

function exportIndex(){
    let size = LEVEL.length;
    let c=document.createElement("canvas");
    c.width=size;
    c.height=size;
    let x=c.getContext("2d");

    let img=x.getImageData(0,0,size,size);

    for(let y=0;y<size;y++){
        for(let xx=0;xx<size;xx++){
            let id=(y*size+xx)*4;
            let col=LEVEL[y][xx];
            if(col<0) col=0;
            img.data[id]=col;
            img.data[id+1]=col;
            img.data[id+2]=col;
            img.data[id+3]=255;
        }
    }

    x.putImageData(img,0,0);
    download(c.toDataURL(),"indexMap.png");
}

function exportPalette(){
    downloadJSON(COLOR_PALETTE,"palette.json");
}

function exportMeta(){
    let meta = {
        name: document.getElementById("levelName").value || "level",
        size: LEVEL.length,
        colors: COLOR_PALETTE.length
    };
    downloadJSON(meta,"meta.json");
}

function download(dataURL,name){
    let a=document.createElement("a");
    a.href=dataURL;
    a.download=name;
    a.click();
}

function downloadJSON(obj,name){
    let a=document.createElement("a");
    a.href="data:application/json,"+encodeURIComponent(JSON.stringify(obj,null,2));
    a.download=name;
    a.click();
}
</script>

</body>
</html>
